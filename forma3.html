<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>3. Forma: Publiskā Datubāze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="full-page-container">
        <a href="index.html" class="back-link top-left">
            &larr; Atpakaļ uz sākumlapu
        </a>
        
        <header>
            <h1>Publiskā datubāze</h1>
            <p class="header-desc">Šajā datubāzē Tu vari apskatīt pieejamās vielas un aprīkojumu</p>
        </header>
        
        <div class="search-and-filter">
            <input type="text" id="searchInput" placeholder="Meklēt pēc nosaukuma...">
            <button class="button primary" onclick="loadData('all')">Rādīt visu</button>
            <button class="button secondary" onclick="loadData('vielas')">Rādīt vielas</button>
            <button class="button secondary" onclick="loadData('inventars')">Rādīt aprīkojumu</button>
        </div>

        <div class="data-table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nosaukums</th>
                        <th>Tips</th>
                        <th>Apakštips</th>
                        <th>Skaits</th>
                        <th>Svars/Daudzums</th>
                        <th>Komentāri</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData(filter) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "<tr><td colspan='7'>Ielādē...</td></tr>";

            try {
                let data = [];
                const resVielas = await fetch('vielas.json');
                const vielas = await resVielas.json();
                const resInventars = await fetch('inventars.json');
                const inventars = await resInventars.json();

                if (filter === 'vielas') {
                    data = vielas;
                } else if (filter === 'inventars') {
                    data = inventars;
                } else {
                    data = [...vielas, ...inventars];
                }

                tableBody.innerHTML = '';
                data.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item.id}</td>
                            <td><strong>${item.nosaukums}</strong></td>
                            <td>${item.tips || ''}</td>
                            <td>${item.apakstips || ''}</td>
                            <td>${item.skaits || ''}</td>
                            <td>${item.daudzums ? item.daudzums + ' ' + (item.mervienibas || '') : ''}</td>
                            <td>${item.komentari || ''}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

            } catch (error) {
                tableBody.innerHTML = "<tr><td colspan='7'>Kļūda ielādējot datus.</td></tr>";
            }
        }

        window.onload = () => loadData('all');
    </script>
</body>
</html>
